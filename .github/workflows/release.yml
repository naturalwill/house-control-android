name: Release

# A signed release build. It needs a keystore of your own: the one the project's releases
# are signed with is not in the repository, and never will be. See "Build it in GitHub
# Actions" in the README for the four secrets this workflow reads.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 1.2.0 (defaults to the tag)'
        required: false
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the Android SDK
        run: |
          # The runner image ships the Android SDK, platform 36 and build-tools 36 included.
          # This only makes sure of it and accepts the licences. (android-actions/setup-android
          # is deliberately not used: it installs the old "tools" package, which the SDK
          # repository no longer has, and fails the step.)
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found; the runner image has no Android SDK."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Work out the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          name="$REQUESTED"
          if [ -z "$name" ]; then name="${GITHUB_REF_NAME#v}"; fi
          # 1.2.3 becomes 10203, so that a later version always sorts above an earlier one.
          code=$(printf '%s' "$name" | awk -F. '{ if (NF >= 3) printf "%d%02d%02d", $1, $2, $3; else if (NF == 2) printf "%d%02d", $1, $2; else printf "%d", $1 }')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # .signing/ is in .gitignore, and the path is the one app/build.gradle.kts expects.
          mkdir -p .signing
          printf '%s' "$KEYSTORE" | base64 --decode > .signing/release.jks

      - name: Check the signing key
        env:
          HOUSE_SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          HOUSE_SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          # Says what is wrong with the key, instead of leaving it to the build.
          keytool -list -keystore .signing/release.jks \
            -alias "$HOUSE_SIGNING_KEY_ALIAS" \
            -storepass "$HOUSE_SIGNING_STORE_PASSWORD"

      - name: Build the release APK
        env:
          HOUSE_SIGNING_STORE_FILE: .signing/release.jks
          HOUSE_SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          HOUSE_SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          HOUSE_SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --console=plain \
            -PversionCode="${{ steps.version.outputs.code }}" \
            -PversionName="${{ steps.version.outputs.name }}"

      - name: Rename and checksum the APK
        id: apk
        run: |
          cd app/build/outputs/apk/release
          # A build without a signing key comes out as app-release-unsigned.apk, and would
          # not install. Say so plainly rather than publishing an APK that cannot be used.
          if [ ! -f app-release.apk ]; then
            echo "::error::app-release.apk not found. The build was probably not signed; check the four secrets."
            ls -l ./*.apk || true
            exit 1
          fi
          file="house-control-${{ steps.version.outputs.name }}.apk"
          mv app-release.apk "$file"
          # The certificate the APK was signed with, to check against the keystore.
          APKSIGNER="$(command -v apksigner || echo "$ANDROID_HOME/build-tools/36.0.0/apksigner")"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$file" > SIGNING.txt
          else
            echo "::warning::apksigner not found; the certificate of the APK was not written out."
            : > SIGNING.txt
          fi
          sha256sum "$file" > SHA256SUMS
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: house-control-release
          path: |
            app/build/outputs/apk/release/${{ steps.apk.outputs.file }}
            app/build/outputs/apk/release/SHA256SUMS
            app/build/outputs/apk/release/SIGNING.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "app/build/outputs/apk/release/${{ steps.apk.outputs.file }}" \
            app/build/outputs/apk/release/SHA256SUMS \
            --generate-notes
